commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,mjs,json,md,yml,yaml,css}'
      run: pnpm exec prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx,js,mjs}'
      run: pnpm exec eslint {staged_files}
