# Lokale Entwicklungsumgebung. Ersetzt den Databus des Edge Device durch Mosquitto.
# Simulator, Core und Module laufen im Dev-Betrieb direkt über `pnpm dev` (Turborepo);
# als Container kommen sie mit der Edge-Paketierung (M10).
name: iot-dev

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883'
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
